<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Books Catalogue</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    #book-list {
      display: grid;
      gap: 16px;
    }

    .book-card {
      background: white;
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .book-card h2 {
      margin-top: 0;
    }

    .error {
      color: red;
      text-align: center;
    }
  </style>
</head>

<body>
  <h1>Books Catalogue</h1>

  <div id="book-list">Loading books...</div>

  <script>
    const bookList = document.getElementById('book-list');

    async function loadBooks() {
      try {
        const response = await fetch('/api/books');

        if (!response.ok) {
          throw new Error('Failed to fetch books');
        }

        const result = await response.json();
        const books = result.data;

        bookList.innerHTML = '';

        books.forEach((book) => {
          const card = document.createElement('div');
          card.className = 'book-card';

          card.innerHTML = `
            <h2>${book.title}</h2>
            <p><strong>Author:</strong> ${book.author}</p>
          `;

          bookList.appendChild(card);
        });
      } catch (error) {
        console.error(error);
        bookList.innerHTML =
          '<p class="error">Unable to load books.</p>';
      }
    }

    loadBooks();
  </script>
</body>
</html>
