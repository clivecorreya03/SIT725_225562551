<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIT725 Task 2.2P</title>
</head>

<body>

    <h1>Express Web Server Demo</h1>

    <h2>Random Quote API</h2>

    <button id="fetchQuoteBtn">Get Quote</button>

    <p id="quoteDisplay"></p>

    <hr>

    <h2>Add Two Numbers</h2>

    <input type="number" id="num1" placeholder="First Number">
    <input type="number" id="num2" placeholder="Second Number">

    <button id="addBtn">Add</button>

    <p id="result"></p>

    <script>

        // Fetch Random Quote
        document.getElementById('fetchQuoteBtn').addEventListener('click', () => {

            fetch('/api/quote')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('quoteDisplay').textContent = data.quote;
                })
                .catch(error => {
                    console.error('Error fetching quote:', error);
                    document.getElementById('quoteDisplay').textContent =
                        'Error fetching quote.';
                });

        });

        // Add Two Numbers
        document.getElementById('addBtn').addEventListener('click', () => {

            const num1 = document.getElementById('num1').value;
            const num2 = document.getElementById('num2').value;

            fetch(`/add?num1=${num1}&num2=${num2}`)
                .then(response => response.json())
                .then(data => {

                    if (data.error) {
                        document.getElementById('result').textContent = data.error;
                    } else {
                        document.getElementById('result').textContent =
                            `Result: ${data.result}`;
                    }

                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('result').textContent =
                        'Error calculating.';
                });

        });

    </script>

</body>
</html>
