<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SIT725 Books Catalogue</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 40px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }

        .book {
            padding: 12px;
            margin-top: 10px;
            background: #eeeeee;
            cursor: pointer;
        }

        #details {
            margin-top: 25px;
            padding: 20px;
            background: #f2f2f2;
            display: none;
        }

    </style>

</head>


<body>


<div class="container">

    <h1>
        Books Catalogue developed by s225562551
    </h1>

    <p>
        Click below to retrieve books from MongoDB.
    </p>

    <button id="getBooks">
        Get all books
    </button>

    <div id="books"></div>

    <div id="details"></div>

</div>


<script>

const button =
    document.getElementById('getBooks');

const booksContainer =
    document.getElementById('books');

const details =
    document.getElementById('details');


button.addEventListener(
    'click',
    loadBooks
);


async function loadBooks() {

    const response =
        await fetch('/api/books');

    const result =
        await response.json();

    booksContainer.innerHTML = '';

    result.data.forEach(book => {

        const element =
            document.createElement('div');

        element.className = 'book';

        element.textContent =
            `${book.title} ${book.price} AUD`;

        element.onclick =
            () => loadBook(book.id);

        booksContainer.appendChild(element);

    });

}


async function loadBook(id) {

    const response =
        await fetch(`/api/books/${id}`);

    const result =
        await response.json();

    const book = result.data;

    details.innerHTML = `
        <h2>Book Details</h2>

        <p><strong>Title:</strong>
        ${book.title}</p>

        <p><strong>Author:</strong>
        ${book.author}</p>

        <p><strong>Year:</strong>
        ${book.year}</p>

        <p><strong>Genre:</strong>
        ${book.genre}</p>

        <p><strong>Summary:</strong>
        ${book.summary}</p>

        <p><strong>Price (AUD):</strong>
        ${book.price}</p>
    `;

    details.style.display = 'block';

}

</script>


</body>

</html>
