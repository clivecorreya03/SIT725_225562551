<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Cybersecurity Dashboard</title>

    <link
        href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
    >

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<nav>
    <div class="nav-wrapper navbar-size">

        <a href="#" class="brand-logo left">
            <i class="material-icons">security</i>
            SIT725
        </a>

        <ul class="right hide-on-med-and-down">
            <li>
                <a href="#">Cybersecurity Dashboard</a>
            </li>
        </ul>

    </div>
</nav>

<main class="main-body">

    <div class="container">

        <div class="row">

            <div class="col s12 center-align">

                <h2>Welcome to the Cybersecurity Dashboard</h2>

                <p class="flow-text">
                    Explore common cybersecurity threats and learn how to
                    protect yourself and your information online.
                </p>

            </div>

            <div class="col s12 center-align">

                <img
                    class="materialboxed materialboxed-image"
                    src="/images/cybersecurity.jpeg"
                    alt="Cybersecurity"
                >

            </div>

            <div class="col s12 center-align">

                <a
                    class="waves-effect waves-light btn click-me-button modal-trigger"
                    id="clickMeButton"
                    data-target="modal1"
                >
                    <i class="material-icons left">security</i>
                    Click Me
                </a>

            </div>

        </div>

        <!-- Three cybersecurity cards will appear here -->
        <div class="row" id="card-section"></div>

    </div>

    <!-- Contact modal -->
    <div id="modal1" class="modal modal-fixed-footer">

        <div class="modal-content">

            <h4 class="center-align">Contact Us</h4>

            <form id="contactForm">

                <div class="row">

                    <div class="input-field col s12 m6">

                        <input
                            placeholder="Enter your first name"
                            id="first_name"
                            type="text"
                            required
                        >

                        <label for="first_name">First Name</label>

                    </div>

                    <div class="input-field col s12 m6">

                        <input
                            id="last_name"
                            type="text"
                            required
                        >

                        <label for="last_name">Last Name</label>

                    </div>

                </div>

                <div class="row">

                    <div class="input-field col s12">

                        <input
                            id="password"
                            type="password"
                            required
                        >

                        <label for="password">Password</label>

                    </div>

                </div>

                <div class="row">

                    <div class="input-field col s12">

                        <input
                            id="email"
                            type="email"
                            required
                        >

                        <label for="email">Email</label>

                    </div>

                </div>

                <div class="row">

                    <div class="input-field col s12">

                        <textarea
                            id="message"
                            class="materialize-textarea"
                        ></textarea>

                        <label for="message">Message</label>

                    </div>

                </div>

                <div class="row">

                    <div class="col s12 center-align">

                        <button
                            class="waves-effect waves-light btn"
                            type="submit"
                            id="formSubmit"
                        >
                            Submit
                        </button>

                    </div>

                </div>

            </form>

        </div>

        <div class="modal-footer">

            <a
                href="#!"
                class="modal-close waves-effect waves-red btn-flat"
            >
                Close
            </a>

        </div>

    </div>

</main>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js">
</script>

<script src="js/scripts.js"></script>

</body>
</html>
